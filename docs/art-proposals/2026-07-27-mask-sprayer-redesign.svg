      <path d="M3 10 L1 13 L5 13 L7 11 Z" fill="#8ba2ad" stroke="#0b1116" stroke-width="1"/>
    </g>
    <text x="30" y="245" fill="#9fb2bf" font-family="sans-serif" font-size="16">面具储罐作为后部质量中心；短宽喷口与楔形冷凝罩形成喷射方向。</text>
  </g>

  <g transform="translate(620 160)">
    <text x="0" y="0" fill="#c9d6df" font-family="sans-serif" font-size="22" font-weight="700">B. 状态语言</text>
    <rect x="0" y="24" width="510" height="270" rx="14" fill="#10171d" stroke="#2b3e4b"/>
    <g font-family="sans-serif" font-size="16">
      <circle cx="55" cy="85" r="18" fill="#7fe7f3"/><text x="90" y="92" fill="#dfe9ee">待机：镜片冷青，喷口仅有薄雾</text>
      <circle cx="55" cy="137" r="18" fill="#f2c35f"/><text x="90" y="144" fill="#dfe9ee">高热：面具边缘转琥珀，阀门急促闪烁</text>
      <circle cx="55" cy="189" r="18" fill="#ef6b63"/><text x="90" y="196" fill="#dfe9ee">过热：喷口闭锁，红色压力环外扩</text>
      <circle cx="55" cy="241" r="18" fill="#d9f8ff"/><text x="90" y="248" fill="#dfe9ee">恢复：冷凝水滴回流，镜片重新点亮</text>
    </g>
  </g>

  <g transform="translate(70 500)">
    <text x="0" y="0" fill="#c9d6df" font-family="sans-serif" font-size="22" font-weight="700">C. 配色与特效</text>
    <rect x="0" y="24" width="1060" height="210" rx="14" fill="#10171d" stroke="#2b3e4b"/>
    <g transform="translate(32 58)">
      <rect width="84" height="48" rx="8" fill="#0b1116"/><text x="0" y="70" fill="#a9bac5" font-family="sans-serif" font-size="14">轮廓黑</text>
      <rect x="112" width="84" height="48" rx="8" fill="#d9e4e8"/><text x="112" y="70" fill="#a9bac5" font-family="sans-serif" font-size="14">面具骨白</text>
      <rect x="224" width="84" height="48" rx="8" fill="#7fe7f3"/><text x="224" y="70" fill="#a9bac5" font-family="sans-serif" font-size="14">冷雾青</text>
      <rect x="336" width="84" height="48" rx="8" fill="#f2c35f"/><text x="336" y="70" fill="#a9bac5" font-family="sans-serif" font-size="14">热量琥珀</text>
      <rect x="448" width="84" height="48" rx="8" fill="#ef6b63"/><text x="448" y="70" fill="#a9bac5" font-family="sans-serif" font-size="14">过热红</text>
    </g>
    <path d="M650 105 C720 65 795 72 860 104 C915 132 958 132 1010 108" fill="none" stroke="#d9f8ff" stroke-width="22" stroke-linecap="round" opacity="0.18"/>
    <path d="M650 105 C720 65 795 72 860 104 C915 132 958 132 1010 108" fill="none" stroke="#8feaf5" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 12"/>
    <text x="650" y="160" fill="#a9bac5" font-family="sans-serif" font-size="15">8 粒短寿命冻雾：中心密、边缘疏；命中只保留小型霜花，避免遮挡敌人。</text>
  </g>
