<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#111820"/>
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="#18232d" stroke="#314553" stroke-width="3"/>
  <text x="56" y="78" fill="#ecf0f1" font-family="sans-serif" font-size="34" font-weight="700">Mask Sprayer — 冻雾面具喷射器重画提案</text>
  <text x="56" y="112" fill="#91a6b5" font-family="sans-serif" font-size="18">25×18 px weapon silhouette · heat resource · 8-pellet freezing spray</text>

  <g transform="translate(70 160)">
    <text x="0" y="0" fill="#c9d6df" font-family="sans-serif" font-size="22" font-weight="700">A. 主轮廓</text>
