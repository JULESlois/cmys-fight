      <circle cx="7" cy="7" r="3.4" fill="#263844" stroke="#0b1116" stroke-width="1"/>
      <path d="M5.7 6.3 L6.7 5.4 L7.8 6.3 L7.2 8.2 L6.1 8.2 Z" fill="#82e6f4"/>
      <circle cx="5.4" cy="6.5" r="0.55" fill="#ecf0f1"/>
      <circle cx="8.5" cy="6.5" r="0.55" fill="#ecf0f1"/>
      <path d="M12 4 L18 4 L22 6 L22 9 L18 11 L12 10 Z" fill="#9fb1ba" stroke="#0b1116" stroke-width="1"/>
      <rect x="16" y="5.3" width="4" height="1.1" fill="#d8fbff"/>
