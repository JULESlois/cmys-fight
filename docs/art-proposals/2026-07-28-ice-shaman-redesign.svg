<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#101923"/><rect x="30" y="30" width="1140" height="740" rx="18" fill="#182734" stroke="#456578" stroke-width="3"/><text x="60" y="80" fill="#f4fdff" font-family="sans-serif" font-size="30" font-weight="700">ICE SHAMAN / 冰霜萨满 重画概念</text><text x="60" y="112" fill="#8fd3e4" font-family="sans-serif" font-size="16">区域控制施法者 · 0.95 秒前摇 · 18 px 减速场</text><g transform="translate(230 250)"><ellipse cx="0" cy="190" rx="110" ry="22" fill="#091016" opacity=".6"/><polygon points="-76,168 -62,28 -32,-8 32,-8 62,28 76,168 38,184 -38,184" fill="#0d1b25"/><polygon points="-66,160 -52,36 -26,4 26,4 52,36 66,160 34,174 -34,174" fill="#dceff3"/><polygon points="-54,155 -44,42 -12,14 -4,14 -12,166 -34,168" fill="#9bcbd6"/><polygon points="12,16 30,16 44,42 54,155 34,168 10,166" fill="#5e9fb2"/><rect x="-75" y="38" width="150" height="17" fill="#f8ffff"/><polygon points="-50,22 -42,-52 -18,-77 18,-77 42,-52 50,22" fill="#0d1b25"/><polygon points="-41,14 -34,-46 -14,-67 14,-67 34,-46 41,14" fill="#4e879a"/><polygon points="-26,-9 -20,-45 20,-45 26,-9" fill="#17313f"/><rect x="-12" y="-31" width="8" height="8" fill="#dcfbff"/><rect x="6" y="-31" width="8" height="8" fill="#dcfbff"/><g fill="#bfeef6" stroke="#0d1b25" stroke-width="7"><polygon points="-46,-64 -54,-124 -34,-95"/><polygon points="-17,-73 -20,-142 -2,-101"/><polygon points="12,-73 20,-136 28,-98"/><polygon points="38,-62 55,-115 50,-82"/></g><g transform="translate(86 10)"><rect x="-8" y="-78" width="18" height="244" fill="#0d1b25"/><rect x="-3" y="-72" width="8" height="232" fill="#6b5d4f"/><polygon points="-38,-86 0,-124 38,-86 24,-43 -24,-43" fill="#0d1b25"/><polygon points="-29,-84 0,-113 29,-84 18,-52 -18,-52" fill="#62c7dd"/><polygon points="-8,-102 8,-102 12,-59 -12,-59" fill="#d8fbff"/></g><g transform="translate(0 194)"><rect x="-78" y="0" width="156" height="8" fill="#71cfe2"/><rect x="-56" y="-12" width="112" height="7" fill="#c7f4fb"/><rect x="-5" y="-26" width="10" height="34" fill="#ecffff"/><rect x="-42" y="-18" width="14" height="14" fill="#9fe2ef"/><rect x="28" y="-18" width="14" height="14" fill="#9fe2ef"/></g></g><g font-family="sans-serif"><text x="430" y="170" fill="#f4fdff" font-size="24" font-weight="700">视觉目标</text><text x="430" y="210" fill="#c7dce5" font-size="18">三角厚毛斗篷、四叉冰冠、深色面罩与独立法杖晶核。</text><text x="430" y="245" fill="#c7dce5" font-size="18">在雪地背景中以深面罩和轮廓负形保持辨识度。</text><text x="430" y="305" fill="#f4fdff" font-size="24" font-weight="700">配色</text><rect x="430" y="330" width="48" height="28" fill="#dceff3"/><rect x="500" y="330" width="48" height="28" fill="#5e9fb2"/><rect x="570" y="330" width="48" height="28" fill="#62c7dd"/><rect x="640" y="330" width="48" height="28" fill="#17313f"/><text x="710" y="351" fill="#c7dce5" font-size="16">毛皮 / 阴面 / 法术 / 面罩</text><text x="430" y="420" fill="#f4fdff" font-size="24" font-weight="700">0.95 秒施法节奏</text><text x="430" y="460" fill="#c7dce5" font-size="18">0.00–0.28：法杖抬升，冰冠收光</text><text x="430" y="493" fill="#c7dce5" font-size="18">0.28–0.60：18 px 虚线冰环逐段点亮</text><text x="430" y="526" fill="#c7dce5" font-size="18">0.60–0.83：中心十字凝结，亮度上升</text><text x="430" y="559" fill="#c7dce5" font-size="18">0.83–0.95：白闪确认，减速场生效</text><text x="430" y="630" fill="#f4fdff" font-size="24" font-weight="700">可读性要求</text><text x="430" y="670" fill="#c7dce5" font-size="18">伤害预警与持续减速场分层；最后 0.12 秒显示白色锁定点。</text><text x="430" y="703" fill="#c7dce5" font-size="18">环形边框保持低密度，避免多只单位同屏时产生视觉噪声。</text><text x="430" y="745" fill="#8fd3e4" font-size="16">下一步：冰冠高度、晶核尺寸、预警环对比度与叠加噪声。</text></g></svg>