<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0b1017"/><rect x="20" y="20" width="1160" height="760" rx="18" fill="#111923" stroke="#324052" stroke-width="2"/><text x="48" y="64" fill="#eef6ff" font-family="sans-serif" font-size="34" font-weight="700">CMYS-FIGHT 美术重画提案</text><text x="48" y="100" fill="#f0b45b" font-family="sans-serif" font-size="20" font-weight="600">对象：Old Pistol / 初始副武器</text><rect x="48" y="132" width="500" height="430" rx="14" fill="#0d141d" stroke="#26384b"/><text x="72" y="170" fill="#9fd8ff" font-family="sans-serif" font-size="22" font-weight="700">概念主视图</text><g transform="translate(115 230)"><path d="M0 70 H250 V120 H180 L160 235 H105 L118 120 H0 Z" fill="#303942" stroke="#0a0d11" stroke-width="12" stroke-linejoin="round"/><path d="M15 82 H225 V102 H15 Z" fill="#6b7780"/><path d="M45 64 H205 V82 H45 Z" fill="#8a969d"/><rect x="222" y="83" width="60" height="24" rx="5" fill="#b8752e" stroke="#0a0d11" stroke-width="8"/><rect x="128" y="122" width="48" height="102" rx="8" fill="#4c2f23" stroke="#0a0d11" stroke-width="10" transform="rotate(8 152 173)"/><path d="M138 135 L162 211" stroke="#9b6643" stroke-width="8"/><circle cx="87" cy="103" r="16" fill="#d09a47" stroke="#0a0d11" stroke-width="7"/><rect x="72" y="48" width="38" height="22" rx="4" fill="#b98d49" stroke="#0a0d11" stroke-width="7"/><path d="M255 95 H315" stroke="#f5c66b" stroke-width="8"/><path d="M282 75 L322 95 L282 115" fill="#fff0a5"/></g><text x="72" y="510" fill="#aab7c4" font-family="sans-serif" font-size="15">轮廓：短枪管、厚机匣、偏后的木柄，强调老旧但可靠</text><text x="72" y="536" fill="#aab7c4" font-family="sans-serif" font-size="15">材质：氧化钢、磨损黄铜、深褐木柄、暖色枪口焰</text><rect x="574" y="132" width="578" height="430" rx="14" fill="#0d141d" stroke="#26384b"/><text x="600" y="170" fill="#9fd8ff" font-family="sans-serif" font-size="22" font-weight="700">设计要求</text><text x="600" y="208" fill="#eef6ff" font-family="sans-serif" font-size="18" font-weight="700">现状问题</text><text x="622" y="238" fill="#aab7c4" font-family="sans-serif" font-size="15">• 初始武器缺少独特轮廓，容易像通用手枪图标</text><text x="622" y="266" fill="#aab7c4" font-family="sans-serif" font-size="15">• 可靠、零能耗的玩法定位没有被材质和动作表达</text><text x="622" y="294" fill="#aab7c4" font-family="sans-serif" font-size="15">• 枪口、后坐与装填反馈不足，射击重量偏轻</text><text x="600" y="338" fill="#eef6ff" font-family="sans-serif" font-size="18" font-weight="700">视觉目标</text><text x="622" y="368" fill="#aab7c4" font-family="sans-serif" font-size="15">• 让玩家一眼识别为“修补过但可信赖”的旧式副武器</text><text x="622" y="396" fill="#aab7c4" font-family="sans-serif" font-size="15">• 与高科技能量武器拉开轮廓、色温和特效差异</text><text x="622" y="424" fill="#aab7c4" font-family="sans-serif" font-size="15">• 保持 320×240 下 16–24 像素长度仍可读</text><text x="600" y="468" fill="#eef6ff" font-family="sans-serif" font-size="18" font-weight="700">建议色板</text><g transform="translate(622 490)"><rect width="70" height="30" fill="#1a1f24"/><rect x="82" width="70" height="30" fill="#59636b"/><rect x="164" width="70" height="30" fill="#b58a48"/><rect x="246" width="70" height="30" fill="#5a3526"/><rect x="328" width="70" height="30" fill="#f0b45b"/></g><rect x="48" y="588" width="1104" height="150" rx="14" fill="#0d141d" stroke="#26384b"/><text x="72" y="624" fill="#9fd8ff" font-family="sans-serif" font-size="22" font-weight="700">动画与特效关键帧</text><text x="72" y="656" fill="#aab7c4" font-family="sans-serif" font-size="15">待机：轻微手腕呼吸，不做持续发光；射击：1帧黄白焰芯 + 2帧橙色余焰 + 2px 后坐；</text><text x="72" y="682" fill="#aab7c4" font-family="sans-serif" font-size="15">空仓：枪机后停并发出干脆金属点击；装填：弹匣/弹巢动作与音效同步；命中：小型暖色火星，避免与能量武器混淆。</text><text x="72" y="716" fill="#aab7c4" font-family="sans-serif" font-size="15">记录：本次处理 Old Pistol。下一步评审枪管长度、黄铜比例、后坐幅度与初始武器图标可读性。</text></svg>