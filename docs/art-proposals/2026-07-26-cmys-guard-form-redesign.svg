<text x="64" y="532" class="s">轮廓关键词：宽肩、塔盾、单眼红光、短披甲、低重心</text><text x="64" y="553" class="s">角色定位：高护甲、稳固推进、明确防御姿态</text>
<rect x="586" y="126" width="572" height="438" rx="14" class="p"/><text x="610" y="160" class="h">设计说明</text>
<text x="610" y="198" class="b">现状问题</text><text x="628" y="226" class="s">• 基础 CMYS 形态共用 16×16 通用人形，身份辨识度不足</text><text x="628" y="250" class="s">• 仅有待机与两帧行走，格挡、受击、射击缺少身体反馈</text><text x="628" y="274" class="s">• 红色只作为色块出现，没有形成“守卫形态”的功能语言</text>
<text x="610" y="314" class="b">视觉目标</text><text x="628" y="342" class="s">• 远距离先读出塔盾与宽肩，再读出枪械</text><text x="628" y="366" class="s">• 通过低重心和前倾盾面表达抗冲击能力</text><text x="628" y="390" class="s">• 与 Arcane、Swift 形态建立清晰轮廓差异</text>
<text x="610" y="430" class="b">建议色板</text>
<g><rect x="628" y="449" width="62" height="30" rx="4" fill="#151b22"/><rect x="700" y="449" width="62" height="30" rx="4" fill="#303944"/><rect x="772" y="449" width="62" height="30" rx="4" fill="#8997a5"/><rect x="844" y="449" width="62" height="30" rx="4" fill="#d84943"/><rect x="916" y="449" width="62" height="30" rx="4" fill="#ff8178"/><rect x="988" y="449" width="62" height="30" rx="4" fill="#eef3f6"/></g>
