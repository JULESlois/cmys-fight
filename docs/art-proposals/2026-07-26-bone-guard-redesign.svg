<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1018"/><stop offset="1" stop-color="#171126"/></linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f675d"/><stop offset="1" stop-color="#2c2830"/></linearGradient>
  <style>
    .t{font:700 32px system-ui,sans-serif;fill:#f0f3f7}.h{font:700 20px system-ui,sans-serif;fill:#b893ff}.b{font:500 16px system-ui,sans-serif;fill:#d6dce5}.s{font:500 13px system-ui,sans-serif;fill:#9eabba}.p{fill:#111a27;stroke:#2d3b50;stroke-width:2}.l{stroke:#465873;stroke-width:2}
  </style>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<text x="36" y="48" class="t">CMYS-FIGHT 美术重画提案：Bone Guard 骨盾卫士</text>
<text x="36" y="76" class="s">类型：怪物 / 地牢近战召唤物　当前机制：13 HP · 34 速度 · 0.30 秒攻击前摇</text>

<rect x="28" y="96" width="350" height="292" rx="12" class="p"/>
<text x="48" y="130" class="h">现状问题</text>
<text x="52" y="164" class="b">• 作为 Grave Summoner 的召唤物，阵营联系不足</text>
<text x="52" y="192" class="b">• 盾牌轮廓普通，难以快速判断“挡在前面”</text>
<text x="52" y="220" class="b">• 0.30 秒前摇很短，但现有动作反馈仍不够集中</text>
<text x="52" y="248" class="b">• 受击与死亡主要依赖整体位移，材质碎裂不足</text>
<text x="48" y="296" class="h">视觉目标</text>
<text x="52" y="328" class="b">高大盾牌、低重心骨架、紫色灵火与墓碑符文</text>
<text x="52" y="356" class="b">在 320×240 下优先读出“盾、骨、亡灵阵营”</text>

<rect x="396" y="96" width="404" height="460" rx="12" class="p"/>
<text x="418" y="130" class="h">概念主视图</text>
<ellipse cx="598" cy="502" rx="112" ry="20" fill="#03060b" opacity=".7"/>
<!-- shield -->
<path d="M620 238 L714 262 L706 456 Q668 500 620 514 Q572 500 534 456 L526 262 Z" fill="#18161d" stroke="#08090c" stroke-width="12"/>
<path d="M620 252 L695 272 L688 445 Q656 479 620 491 Q584 479 552 445 L545 272 Z" fill="url(#shield)" stroke="#9a9180" stroke-width="5"/>
