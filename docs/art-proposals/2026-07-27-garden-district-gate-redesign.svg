  <text x="934" y="170" fill="#72E0E8" font-family="sans-serif" font-size="20" font-weight="700">STATE NOTES</text>
  <text x="934" y="213" fill="#D8E5E0" font-family="sans-serif" font-size="15" font-weight="700">IDLE</text>
  <text x="934" y="238" fill="#91A6A5" font-family="sans-serif" font-size="13">Seed core breathes at 1.2 Hz;</text>
  <text x="934" y="258" fill="#91A6A5" font-family="sans-serif" font-size="13">two leaf motes max.</text>
  <text x="934" y="305" fill="#D8E5E0" font-family="sans-serif" font-size="15" font-weight="700">PROXIMITY</text>
  <text x="934" y="330" fill="#91A6A5" font-family="sans-serif" font-size="13">Vine dashes fill inward;</text>
  <text x="934" y="350" fill="#91A6A5" font-family="sans-serif" font-size="13">lanterns brighten one step.</text>
  <text x="934" y="397" fill="#D8E5E0" font-family="sans-serif" font-size="15" font-weight="700">CONFIRM</text>
  <text x="934" y="422" fill="#91A6A5" font-family="sans-serif" font-size="13">0.35 s seed flash, then a</text>
  <text x="934" y="442" fill="#91A6A5" font-family="sans-serif" font-size="13">single leaf sweep across arch.</text>
  <text x="934" y="489" fill="#D8E5E0" font-family="sans-serif" font-size="15" font-weight="700">READABILITY</text>
  <text x="934" y="514" fill="#91A6A5" font-family="sans-serif" font-size="13">Open center remains clear.</text>
  <text x="934" y="534" fill="#91A6A5" font-family="sans-serif" font-size="13">Glow stays above walk lane.</text>
  <text x="934" y="554" fill="#91A6A5" font-family="sans-serif" font-size="13">Root feet match collider width.</text>
  <text x="934" y="601" fill="#D8E5E0" font-family="sans-serif" font-size="15" font-weight="700">NEXT REVIEW</text>
  <text x="934" y="626" fill="#91A6A5" font-family="sans-serif" font-size="13">Arch height, vine density,</text>
  <text x="934" y="646" fill="#91A6A5" font-family="sans-serif" font-size="13">seed-core brightness, and</text>
  <text x="934" y="666" fill="#91A6A5" font-family="sans-serif" font-size="13">1× silhouette separation.</text>

