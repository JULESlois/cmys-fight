  <text x="76" y="612" fill="#91A6A5" font-family="sans-serif" font-size="14">• Same silhouette as other district gates</text>
  <text x="76" y="636" fill="#91A6A5" font-family="sans-serif" font-size="14">• Garden identity depends mostly on hue</text>
  <text x="76" y="660" fill="#91A6A5" font-family="sans-serif" font-size="14">• No proximity / confirmation response</text>

