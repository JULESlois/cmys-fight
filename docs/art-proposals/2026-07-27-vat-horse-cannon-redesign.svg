<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#111722"/>
  <rect x="36" y="36" width="1128" height="728" rx="18" fill="#182231" stroke="#3A4A5F" stroke-width="3"/>
  <text x="70" y="92" fill="#F4F7FA" font-family="sans-serif" font-size="34" font-weight="700">VAT-HORSE CANNON / 重画概念板</text>
  <text x="72" y="126" fill="#9FB2C8" font-family="sans-serif" font-size="17">三联弹仓 · 跳弹燃烧弹 · 畜力罐体轮廓</text>

  <g transform="translate(90 175)">
    <text x="0" y="0" fill="#FFB36A" font-family="sans-serif" font-size="21" font-weight="700">主轮廓</text>
    <rect x="0" y="28" width="650" height="300" rx="12" fill="#0D131C" stroke="#314154"/>
    <g transform="translate(55 95)">
