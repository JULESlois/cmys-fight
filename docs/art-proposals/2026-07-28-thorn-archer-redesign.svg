<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#151b18"/><text x="48" y="58" fill="#eef5dc" font-family="monospace" font-size="30" font-weight="700">Thorn Archer / 荆棘弓手 重画概念</text><text x="48" y="92" fill="#9fc067" font-family="monospace" font-size="16">forest ranged unit · 7 HP · windup 0.48s · poison arrow</text><g transform="translate(80 145)"><rect x="0" y="0" width="430" height="510" rx="16" fill="#202a24" stroke="#405246" stroke-width="3"/><text x="24" y="40" fill="#dce8d0" font-family="monospace" font-size="20">主轮廓</text><g transform="translate(210 290) scale(6)"><rect x="-5" y="-18" width="10" height="18" fill="#4b3826"/><rect x="-8" y="-29" width="14" height="11" fill="#243127"/><rect x="-5" y="-31" width="8" height="4" fill="#7da449"/><rect x="-10" y="-18" width="6" height="16" fill="#315b35"/><rect x="-12" y="-18" width="4" height="7" fill="#8bc34a"/><rect x="5" y="-15" width="9" height="4" fill="#765238"/><rect x="14" y="-27" width="3" height="29" fill="#6b442a"/><rect x="12" y="-29" width="5" height="4" fill="#9fc067"/><rect x="12" y="0" width="5" height="4" fill="#9fc067"/><rect x="3" y="-14" width="13" height="1" fill="#d7ef9b"/><rect x="-4" y="0" width="3" height="6" fill="#51402b"/><rect x="2" y="0" width="3" height="6" fill="#5a432c"/><rect x="0" y="-22" width="1" height="1" fill="#d7ff87"/></g><text x="24" y="468" fill="#cbd9c2" font-family="monospace" font-size="15">高尖刺兜帽 / 叶披肩 / 窄树皮躯干</text><text x="24" y="492" fill="#cbd9c2" font-family="monospace" font-size="15">弓体高于头顶，建立远程单位识别</text></g><g transform="translate(540 145)"><rect x="0" y="0" width="580" height="510" rx="16" fill="#202a24" stroke="#405246" stroke-width="3"/><text x="24" y="40" fill="#dce8d0" font-family="monospace" font-size="20">状态与配色</text><g font-family="monospace" font-size="16"><text x="28" y="86" fill="#eef5dc">基础色</text><rect x="130" y="68" width="54" height="24" fill="#4b3826"/><text x="195" y="86" fill="#cbd9c2">树皮躯干</text><rect x="320" y="68" width="54" height="24" fill="#315b35"/><text x="385" y="86" fill="#cbd9c2">深叶披肩</text><rect x="130" y="108" width="54" height="24" fill="#9fc067"/><text x="195" y="126" fill="#cbd9c2">荆棘高光</text><rect x="320" y="108" width="54" height="24" fill="#d7ef9b"/><text x="385" y="126" fill="#cbd9c2">毒箭预警</text></g><line x1="40" y1="168" x2="540" y2="168" stroke="#405246"/><text x="28" y="205" fill="#eef5dc" font-family="monospace" font-size="18">0.48 秒攻击前摇</text><g font-family="monospace" font-size="15" fill="#cbd9c2"><text x="40" y="242">1. 站稳：后脚外移 1 px，披肩下压</text><text x="40" y="274">2. 拉弓：弓弦后移 3–4 px，弓臂展开</text><text x="40" y="306">3. 锁定：箭头出现黄绿 1 px 闪点</text><text x="40" y="338">4. 释放：弓体前弹，叶片轻微反向抖动</text></g><text x="28" y="390" fill="#eef5dc" font-family="monospace" font-size="18">可读性要求</text><g font-family="monospace" font-size="15" fill="#cbd9c2"><text x="40" y="425">• 1× 缩放仍能看出弓弦与弓臂负形</text><text x="40" y="455">• 毒箭预警仅在线性射击轴上出现</text><text x="40" y="485">• 与 Root Lancer 区分：更短、更直、更高弓</text></g></g></g><text x="48" y="718" fill="#7f9585" font-family="monospace" font-size="14">Concept file: docs/art-proposals/2026-07-28-thorn-archer-redesign.svg</text></svg>