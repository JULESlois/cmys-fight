<text x="66" y="610" class="small">轮廓：前倾兜帽、分叉短披风、双臂外张、尖锐靴型</text><text x="66" y="633" class="small">材质：轻型护甲 / 绿色能量缝线 / 冲刺残影</text>
<rect x="670" y="126" width="688" height="520" rx="14" class="panel"/><text x="694" y="162" class="head">设计要求</text>
<text x="694" y="202" class="body">现状问题</text><text x="714" y="232" class="small">• Swift Form 未进入 detailed character art 列表，仍依赖通用角色体型</text><text x="714" y="258" class="small">• 速度 120 与冲刺后暴击被动缺少专属身体语言</text><text x="714" y="284" class="small">• 与 Guard、Arcane 的差异主要落在配色与数值，轮廓层不足</text>
<text x="694" y="330" class="body">视觉目标</text><text x="714" y="360" class="small">• 320×240 下仅凭前倾姿态和短披风即可识别高速形态</text><text x="714" y="386" class="small">• 冲刺结束后的 2 秒暴击窗口必须具有持续但克制的状态反馈</text><text x="714" y="412" class="small">• 霰弹枪后坐与角色轻量化动作需要形成反差，不削弱武器重量感</text>
<text x="694" y="458" class="body">建议色板</text>
<g><rect x="714" y="480" width="72" height="34" rx="4" fill="#0e211b"/><rect x="798" y="480" width="72" height="34" rx="4" fill="#12543f"/><rect x="882" y="480" width="72" height="34" rx="4" fill="#25b86d"/><rect x="966" y="480" width="72" height="34" rx="4" fill="#72f0a3"/><rect x="1050" y="480" width="72" height="34" rx="4" fill="#dff8ef"/></g>
<text x="714" y="540" class="small">深影 #0E211B · 主体 #12543F · 主绿 #25B86D · 能量 #72F0A3 · 高光 #DFF8EF</text>
<text x="694" y="580" class="body">玩法可读性</text><text x="714" y="610" class="small">• 冲刺轨迹不得遮挡脚下危险区；主残影寿命建议 0.18–0.24 秒</text><text x="714" y="634" class="small">• 暴击窗口使用肩线与靴部脉冲，不使用全身强闪烁</text>
<rect x="42" y="674" width="1316" height="168" rx="14" class="panel"/><text x="66" y="710" class="head">动画关键帧建议</text>
<g transform="translate(82 738)">
  <g transform="translate(0 0)"><path d="M18 72 L34 20 L55 9 L76 24 L88 72 Z" fill="url(#cloth)" stroke="#aef5c8" stroke-width="3"/><text x="25" y="103" class="label">待机</text></g>
  <g transform="translate(180 0)"><path d="M8 72 L28 30 L60 18 L91 34 L102 72 Z" fill="url(#cloth)" stroke="#aef5c8" stroke-width="3"/><path d="M5 50 H-35" stroke="#4df08f" stroke-width="7" opacity=".4"/><text x="24" y="103" class="label">疾跑</text></g>
  <g transform="translate(360 0)"><path d="M-6 72 L22 38 L58 31 L97 40 L116 72 Z" fill="url(#cloth)" stroke="#dff8ef" stroke-width="4"/><path d="M-50 58 H0" stroke="#72f0a3" stroke-width="12" opacity=".45"/><text x="26" y="103" class="label">冲刺</text></g>
  <g transform="translate(560 0)"><path d="M14 72 L33 24 L57 14 L80 27 L94 72 Z" fill="url(#cloth)" stroke="#aef5c8" stroke-width="3"/><g fill="#72f0a3" filter="url(#glow)"><rect x="16" y="12" width="7" height="7" transform="rotate(45 19 15)"/><rect x="91" y="15" width="7" height="7" transform="rotate(45 94 18)"/></g><text x="0" y="103" class="label">暴击窗口</text></g>
  <g transform="translate(770 0)"><path d="M4 72 L28 35 L58 30 L96 37 L110 72 Z" fill="url(#cloth)" stroke="#aef5c8" stroke-width="3"/><path d="M104 40 L154 29 L178 43 L151 56" fill="#dff8ef" stroke="#2a6b53" stroke-width="3"/><path d="M0 43 H-34" stroke="#72f0a3" stroke-width="5" opacity=".35"/><text x="15" y="103" class="label">霰弹射击</text></g>
  <g transform="translate(1010 0)"><path d="M10 72 L32 48 L58 44 L90 49 L106 72 Z" fill="#214a3c" stroke="#eafff3" stroke-width="4"/><path d="M26 18 L92 78 M93 18 L25 78" stroke="#ffffff" stroke-width="5" opacity=".75"/><text x="27" y="103" class="label">受击</text></g>
</g>
<text x="46" y="872" class="small">记录：本次对象为 CMYS Swift Form。下一步重点：前倾幅度、披风长度、冲刺残影寿命、暴击窗口脉冲强度、霰弹后坐帧数。</text>
</svg>