  <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72f0a3"/><stop offset="0.48" stop-color="#25b86d"/><stop offset="1" stop-color="#12543f"/></linearGradient>
