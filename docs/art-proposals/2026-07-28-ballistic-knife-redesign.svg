<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#10151d"/>
  <rect x="24" y="24" width="1352" height="852" rx="18" fill="#18212b" stroke="#344554" stroke-width="3"/>
  <text x="62" y="78" fill="#f2f5f7" font-size="34" font-family="sans-serif" font-weight="700">Ballistic Knife / 弹射军刀 — Redesign Sheet</text>
  <text x="62" y="112" fill="#8fa6b8" font-size="18" font-family="sans-serif">CMYS-FIGHT · weapon concept · 2026-07-28</text>

  <g transform="translate(70 160)">
    <text x="0" y="0" fill="#f2f5f7" font-size="24" font-family="sans-serif" font-weight="700">A. Core silhouette</text>
    <rect x="0" y="28" width="620" height="300" rx="12" fill="#0d1319" stroke="#2e3b47"/>
    <g transform="translate(62 95)">
      <polygon points="0,54 58,35 255,35 325,18 425,18 425,48 325,48 255,70 58,70" fill="#27323c" stroke="#0a0f14" stroke-width="8"/>
      <polygon points="258,36 325,22 422,22 422,44 326,44 258,62" fill="#c8d1d8"/>
      <polygon points="322,27 421,27 421,38 330,38" fill="#f2f5f7"/>
      <rect x="52" y="42" width="188" height="22" rx="6" fill="#5f6e79"/>
      <rect x="72" y="47" width="112" height="12" rx="4" fill="#98a8b3"/>
      <rect x="188" y="45" width="47" height="16" rx="4" fill="#d08b45"/>
      <polygon points="84,69 150,69 137,139 95,139" fill="#2e3943" stroke="#0a0f14" stroke-width="7"/>
      <rect x="98" y="82" width="34" height="42" rx="6" fill="#53636f"/>
      <circle cx="40" cy="53" r="18" fill="#9aa8b1" stroke="#0a0f14" stroke-width="7"/>
      <circle cx="40" cy="53" r="7" fill="#e9b65d"/>
      <path d="M244 43 L273 49 L244 58" fill="#efb54a"/>
      <path d="M278 49 L310 49" stroke="#efb54a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="34" y="284" fill="#9eb2c1" font-size="17" font-family="sans-serif">rear spring housing · visible blade rail · locking collar · compact angled grip</text>
  </g>

  <g transform="translate(730 160)">
    <text x="0" y="0" fill="#f2f5f7" font-size="24" font-family="sans-serif" font-weight="700">B. Functional states</text>
    <rect x="0" y="28" width="600" height="300" rx="12" fill="#0d1319" stroke="#2e3b47"/>
    <g transform="translate(28 62)" font-family="sans-serif">
      <g transform="translate(0 0)">
        <text x="0" y="0" fill="#c8d1d8" font-size="16">READY</text>
        <rect x="0" y="18" width="120" height="58" rx="8" fill="#242f39"/>
        <rect x="17" y="38" width="72" height="12" fill="#aab5bc"/>
        <polygon points="89,34 116,44 89,54" fill="#e9edf0"/>
        <circle cx="14" cy="44" r="6" fill="#e9b65d"/>
      </g>
      <g transform="translate(145 0)">
        <text x="0" y="0" fill="#c8d1d8" font-size="16">FIRE</text>
        <rect x="0" y="18" width="120" height="58" rx="8" fill="#242f39"/>
        <rect x="15" y="38" width="55" height="12" fill="#8998a3"/>
        <polygon points="83,32 118,44 83,56" fill="#f2f5f7"/>
        <path d="M72 28 L82 44 L72 60" stroke="#efb54a" stroke-width="4" fill="none"/>
      </g>
      <g transform="translate(290 0)">
        <text x="0" y="0" fill="#c8d1d8" font-size="16">EMPTY</text>
        <rect x="0" y="18" width="120" height="58" rx="8" fill="#242f39"/>
        <rect x="15" y="38" width="72" height="12" fill="#4b5964"/>
        <rect x="88" y="34" width="20" height="20" fill="#6f3f3f"/>
      </g>
      <g transform="translate(435 0)">
        <text x="0" y="0" fill="#c8d1d8" font-size="16">RELOAD</text>
        <rect x="0" y="18" width="120" height="58" rx="8" fill="#242f39"/>
        <rect x="16" y="39" width="54" height="10" fill="#6a7882"/>
        <polygon points="72,23 105,15 108,24 77,32" fill="#dce2e6"/>
        <path d="M86 62 C98 57 106 49 109 39" stroke="#61c7d7" stroke-width="3" fill="none"/>
      </g>
      <text x="0" y="122" fill="#f2f5f7" font-size="18" font-weight="700">Projectile readability</text>
      <line x1="18" y1="160" x2="520" y2="160" stroke="#344554" stroke-width="2"/>
      <polygon points="54,142 94,160 54,178 65,160" fill="#e7edf0" stroke="#0a0f14" stroke-width="4"/>
      <line x1="98" y1="160" x2="210" y2="160" stroke="#b7c5ce" stroke-width="5"/>
      <line x1="100" y1="151" x2="190" y2="151" stroke="#f2f5f7" stroke-width="2"/>
      <text x="236" y="155" fill="#9eb2c1" font-size="15">fast blade, short trail, no gun-flash silhouette</text>
      <text x="236" y="178" fill="#9eb2c1" font-size="15">3-target pierce: one bright leading edge + fading wake</text>
    </g>
  </g>

  <g transform="translate(70 530)">
    <text x="0" y="0" fill="#f2f5f7" font-size="24" font-family="sans-serif" font-weight="700">C. Palette and implementation notes</text>
    <rect x="0" y="28" width="1260" height="270" rx="12" fill="#0d1319" stroke="#2e3b47"/>
    <g transform="translate(30 64)" font-family="sans-serif">
      <rect x="0" y="0" width="62" height="62" rx="8" fill="#111820"/><text x="0" y="84" fill="#9eb2c1" font-size="14">outline</text>
      <rect x="86" y="0" width="62" height="62" rx="8" fill="#5f6e79"/><text x="86" y="84" fill="#9eb2c1" font-size="14">housing</text>
      <rect x="172" y="0" width="62" height="62" rx="8" fill="#c8d1d8"/><text x="172" y="84" fill="#9eb2c1" font-size="14">blade</text>
      <rect x="258" y="0" width="62" height="62" rx="8" fill="#f2f5f7"/><text x="258" y="84" fill="#9eb2c1" font-size="14">edge</text>
      <rect x="344" y="0" width="62" height="62" rx="8" fill="#d08b45"/><text x="344" y="84" fill="#9eb2c1" font-size="14">collar</text>
      <rect x="430" y="0" width="62" height="62" rx="8" fill="#efb54a"/><text x="430" y="84" fill="#9eb2c1" font-size="14">loaded cue</text>

      <text x="560" y="8" fill="#f2f5f7" font-size="18" font-weight="700">Animation targets</text>
      <text x="560" y="38" fill="#9eb2c1" font-size="16">• 4-frame fire: compress → collar flash → blade release → spring return</text>
      <text x="560" y="66" fill="#9eb2c1" font-size="16">• 5-frame reload: grip tilt → blade insert → rail lock → collar pulse → ready</text>
      <text x="560" y="94" fill="#9eb2c1" font-size="16">• Impact: thin silver slash, no explosion; brief spark only on armored hit</text>
      <text x="560" y="122" fill="#9eb2c1" font-size="16">• Keep effect inside 28×16 weapon footprint and 320×240 combat readability</text>

      <text x="0" y="145" fill="#f2f5f7" font-size="18" font-weight="700">Primary revision focus</text>
      <text x="0" y="176" fill="#9eb2c1" font-size="16">1. Separate blade silhouette from firearm body at 1× scale.</text>
      <text x="0" y="204" fill="#9eb2c1" font-size="16">2. Make loaded/empty state legible through collar and rail, not UI color alone.</text>
      <text x="650" y="176" fill="#9eb2c1" font-size="16">3. Keep the projectile straight and silent despite disc-style spin logic.</text>
      <text x="650" y="204" fill="#9eb2c1" font-size="16">4. Review handle angle, blade length, recoil distance and trail lifetime.</text>
    </g>
  </g>
</svg>