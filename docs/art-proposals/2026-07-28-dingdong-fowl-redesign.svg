<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#12161d"/>
  <rect x="36" y="36" width="1128" height="728" rx="18" fill="#1b222c" stroke="#3b4654" stroke-width="3"/>
  <text x="70" y="88" fill="#f4f1de" font-family="sans-serif" font-size="34" font-weight="700">Ding-Dong Fowl / 铃响禽 重画概念</text>
  <text x="70" y="122" fill="#9eabb8" font-family="sans-serif" font-size="18">目标：强化“钟腹散射怪”的轮廓、攻击预警与四向弹幕可读性</text>

  <g transform="translate(110 175)">
    <text x="0" y="0" fill="#f1c40f" font-family="sans-serif" font-size="22" font-weight="700">主轮廓</text>
    <ellipse cx="205" cy="245" rx="125" ry="28" fill="#0c1016" opacity=".7"/>
    <path d="M95 230 L78 170 L118 142 L132 85 L170 45 L220 38 L267 58 L292 104 L320 123 L302 159 L330 205 L285 232 Z" fill="#252c35" stroke="#0a0d12" stroke-width="12" stroke-linejoin="round"/>
