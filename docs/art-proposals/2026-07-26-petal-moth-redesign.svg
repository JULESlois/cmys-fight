<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081318"/><stop offset="1" stop-color="#171022"/></linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd5e7"/><stop offset=".48" stop-color="#e98fb2"/><stop offset="1" stop-color="#784d78"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5dc72"/><stop offset="1" stop-color="#6d5030"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 34px ui-sans-serif,system-ui,sans-serif;fill:#f5fbff}.sub{font:600 18px ui-sans-serif,system-ui,sans-serif;fill:#f1a7c6}
    .head{font:700 22px ui-sans-serif,system-ui,sans-serif;fill:#f3b4d0}.body{font:500 16px ui-sans-serif,system-ui,sans-serif;fill:#dbe7ed}.small{font:500 14px ui-sans-serif,system-ui,sans-serif;fill:#a8bac4}.panel{fill:#101a23;stroke:#2b3b48;stroke-width:2}.label{font:700 14px ui-sans-serif,system-ui,sans-serif;fill:#eef8fb}
  </style>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="764" rx="18" fill="none" stroke="#3a4657" stroke-width="2"/>
<text x="44" y="61" class="title">CMYS-FIGHT 美术重画提案</text><text x="44" y="96" class="sub">对象：Petal Moth（花瓣蛾） · 森林轨道弹远程单位</text>

<rect x="42" y="126" width="520" height="430" rx="14" class="panel"/><text x="64" y="160" class="head">概念主视图</text>
<ellipse cx="302" cy="484" rx="106" ry="19" fill="#03070b" opacity=".62"/>
<g transform="translate(302 326)">
  <path d="M-14 -8 C-60 -66 -126 -62 -144 -18 C-130 22 -88 52 -35 40 C-45 15 -40 -6 -14 -8Z" fill="url(#wing)" stroke="#271a35" stroke-width="8"/>
  <path d="M14 -8 C60 -66 126 -62 144 -18 C130 22 88 52 35 40 C45 15 40 -6 14 -8Z" fill="url(#wing)" stroke="#271a35" stroke-width="8"/>
  <path d="M-22 32 C-68 36 -104 74 -91 108 C-48 101 -18 79 -4 51Z" fill="#b96f9a" stroke="#271a35" stroke-width="7"/>
  <path d="M22 32 C68 36 104 74 91 108 C48 101 18 79 4 51Z" fill="#b96f9a" stroke="#271a35" stroke-width="7"/>
  <ellipse cx="0" cy="18" rx="25" ry="60" fill="url(#body)" stroke="#231b22" stroke-width="8"/>
  <circle cx="0" cy="-36" r="26" fill="#34243c" stroke="#231b22" stroke-width="8"/>
  <circle cx="-9" cy="-39" r="4" fill="#f7fff4"/><circle cx="9" cy="-39" r="4" fill="#f7fff4"/>
  <path d="M-7 -57 C-25 -85 -36 -88 -44 -77" fill="none" stroke="#f4b8d0" stroke-width="5"/><path d="M7 -57 C25 -85 36 -88 44 -77" fill="none" stroke="#f4b8d0" stroke-width="5"/>
  <g fill="#ffd6e8" filter="url(#glow)"><circle cx="-86" cy="-23" r="7"/><circle cx="86" cy="-23" r="7"/><circle cx="-62" cy="54" r="5"/><circle cx="62" cy="54" r="5"/></g>
  <g fill="#f6d96b"><circle cx="-114" cy="1" r="5"/><circle cx="114" cy="1" r="5"/><circle cx="0" cy="65" r="4"/></g>
</g>
<text x="64" y="520" class="small">轮廓：宽翼、细腹、双层花瓣尾翼；主体与轨道弹保持间隙。</text><text x="64" y="544" class="small">材质：花瓣粉、暗紫膜翅、黄粉核心、白色预警点。</text>

<rect x="582" y="126" width="576" height="430" rx="14" class="panel"/><text x="604" y="160" class="head">设计要求</text>
<text x="604" y="198" class="body">现状问题</text><text x="622" y="226" class="small">• 当前主要依赖通用整体位移，翼拍、腹部与轨道弹缺乏独立节奏。</text><text x="622" y="252" class="small">• 粉色主体与森林花朵、毒素反馈容易混淆。</text><text x="622" y="278" class="small">• 0.42 秒前摇不足以通过轮廓变化清楚表达三枚轨道弹。</text>
<text x="604" y="320" class="body">视觉与玩法目标</text><text x="622" y="348" class="small">• 远距离先读到宽翼轮廓，再读到黄粉核心与三枚轨道点。</text><text x="622" y="374" class="small">• 攻击前翼面收拢，三枚空心花粉点位先出现，再生成弹体。</text><text x="622" y="400" class="small">• 弹体使用白黄核心与暗紫外缘，避开青色泉水和绿色毒区。</text><text x="622" y="426" class="small">• 受击压缩翼面；死亡按“翼片脱落—花粉散开—腹部坠落”排序。</text>
<text x="604" y="470" class="body">建议色板</text>
<g><rect x="622" y="491" width="64" height="30" rx="4" fill="#21172b"/><rect x="696" y="491" width="64" height="30" rx="4" fill="#784d78"/><rect x="770" y="491" width="64" height="30" rx="4" fill="#e98fb2"/><rect x="844" y="491" width="64" height="30" rx="4" fill="#ffd5e7"/><rect x="918" y="491" width="64" height="30" rx="4" fill="#f6d96b"/><rect x="992" y="491" width="64" height="30" rx="4" fill="#f7fff4"/></g>
<text x="628" y="542" class="small">阴影</text><text x="704" y="542" class="small">膜翅</text><text x="779" y="542" class="small">花瓣</text><text x="851" y="542" class="small">高光</text><text x="926" y="542" class="small">花粉</text><text x="1002" y="542" class="small">预警</text>

<rect x="42" y="580" width="1116" height="164" rx="14" class="panel"/><text x="64" y="614" class="head">动画关键帧与实现拆分</text>
<g transform="translate(76 638)">
  <g transform="translate(0 0)"><path d="M15 45 C35 5 70 5 88 45 C68 58 35 58 15 45Z" fill="url(#wing)"/><ellipse cx="52" cy="42" rx="10" ry="25" fill="url(#body)"/><text x="34" y="92" class="label">待机</text></g>
  <g transform="translate(160 0)"><path d="M8 48 C28 20 69 16 96 48 C72 57 34 59 8 48Z" fill="url(#wing)"/><ellipse cx="52" cy="44" rx="10" ry="24" fill="url(#body)"/><text x="34" y="92" class="label">移动</text></g>
  <g transform="translate(320 0)"><path d="M22 49 C37 20 67 20 82 49 C65 56 39 56 22 49Z" fill="#f6bdd3"/><ellipse cx="52" cy="43" rx="10" ry="25" fill="url(#body)"/><g fill="none" stroke="#f7fff4" stroke-width="3"><circle cx="4" cy="24" r="7"/><circle cx="100" cy="24" r="7"/><circle cx="52" cy="0" r="7"/></g><text x="15" y="92" class="label">攻击前摇</text></g>
  <g transform="translate(500 0)"><path d="M15 45 C35 5 70 5 88 45 C68 58 35 58 15 45Z" fill="url(#wing)"/><ellipse cx="52" cy="42" rx="10" ry="25" fill="url(#body)"/><g fill="#f6d96b" stroke="#21172b" stroke-width="3"><circle cx="2" cy="25" r="9"/><circle cx="102" cy="25" r="9"/><circle cx="52" cy="-2" r="9"/></g><text x="31" y="92" class="label">释放</text></g>
  <g transform="translate(680 0)"><path d="M18 52 C35 35 70 35 87 52 C67 62 37 62 18 52Z" fill="#8e6385"/><ellipse cx="52" cy="47" rx="13" ry="20" fill="#f5e2a0"/><path d="M26 13 L79 72 M79 13 L26 72" stroke="#fff" stroke-width="5"/><text x="34" y="92" class="label">受击</text></g>
  <g transform="translate(850 0)"><g fill="#b66f99"><path d="M9 25 l30 13 -20 28Z"/><path d="M96 25 l-30 13 20 28Z"/></g><g fill="#f6d96b"><circle cx="52" cy="18" r="5"/><circle cx="36" cy="42" r="4"/><circle cx="72" cy="46" r="4"/></g><ellipse cx="52" cy="67" rx="9" ry="15" fill="#6d5030"/><text x="34" y="92" class="label">死亡</text></g>
</g>
<text x="44" y="770" class="small">记录：本次处理 Petal Moth。下一步评审翼宽、三枚轨道点间距、花粉弹色值、翼拍频率及死亡碎片数量。</text>
</svg>