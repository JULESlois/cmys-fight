<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d14"/><stop offset="1" stop-color="#151022"/></linearGradient>
  <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5f4384"/><stop offset="0.55" stop-color="#34264d"/><stop offset="1" stop-color="#171221"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9aa3a7"/><stop offset="1" stop-color="#424a50"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 32px system-ui,sans-serif;fill:#f2f5f7}.sub{font:600 18px system-ui,sans-serif;fill:#85f0c8}.h{font:700 21px system-ui,sans-serif;fill:#caa5ff}.b{font:500 16px system-ui,sans-serif;fill:#d6dde4}.s{font:500 13px system-ui,sans-serif;fill:#9eaeba}.panel{fill:#101824;stroke:#2d4052;stroke-width:2}.tag{fill:#251b36;stroke:#7853a2;stroke-width:1}
  </style>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="764" rx="18" fill="none" stroke="#35465a" stroke-width="2"/>
<text x="44" y="58" class="title">CMYS-FIGHT 美术重画提案：Grave Summoner 墓穴召唤师</text>
<text x="44" y="88" class="sub">类别：怪物 / 地牢召唤单位 · 小范围重画</text>

<rect x="40" y="116" width="360" height="294" rx="12" class="panel"/>
<text x="60" y="150" class="h">现状问题与视觉目标</text>
<text x="60" y="184" class="b">现状问题</text>
<text x="76" y="212" class="s">• 主体轮廓接近普通长袍施法者，远距离辨识度不足</text>
<text x="76" y="236" class="s">• 0.82 秒前摇缺少分阶段聚能与召唤落点提示</text>
<text x="76" y="260" class="s">• 棺碑法杖已有主题，但与地面召唤事件联系较弱</text>
<text x="76" y="284" class="s">• 受击与死亡仍缺少“灵火熄灭 / 墓布坍塌”层次</text>
<text x="60" y="322" class="b">视觉目标</text>
<text x="76" y="350" class="s">• 建立高帽兜、长碑杖、拖地墓布的三段式轮廓</text>
<text x="76" y="374" class="s">• 一眼识别为召唤者，而不是普通散射法师</text>
<text x="76" y="398" class="s">• 保持 320×240 下的剪影清晰与战斗可读性</text>

<rect x="424" y="116" width="736" height="420" rx="12" class="panel"/>
<text x="448" y="150" class="h">具体概念方案</text>
<ellipse cx="690" cy="475" rx="120" ry="22" fill="#03060a" opacity=".75"/>
<ellipse cx="690" cy="466" rx="90" ry="14" fill="#6df3bd" opacity=".18" filter="url(#glow)"/>

<!-- staff rear -->
<g>
  <rect x="792" y="238" width="18" height="224" rx="7" fill="#201720" stroke="#0b080e" stroke-width="6"/>
  <rect x="798" y="246" width="6" height="205" fill="#765a43"/>
  <path d="M759 221 L801 191 L843 221 L835 286 L767 286 Z" fill="url(#stone)" stroke="#11151a" stroke-width="7"/>
  <rect x="793" y="208" width="16" height="56" fill="#252c31"/>
  <rect x="797" y="220" width="8" height="28" fill="#72f3bd" filter="url(#glow)"/>
  <path d="M777 230 H825 M801 211 V269" stroke="#b5fff0" stroke-width="5" opacity=".8"/>
</g>

<!-- robe silhouette -->
<path d="M617 454 C605 400 616 336 644 302 C642 258 660 226 690 218 C721 224 739 258 736 302 C766 338 775 402 764 454 L736 478 L710 464 L690 484 L669 464 L640 478 Z" fill="#090b12" stroke="#05060a" stroke-width="12"/>
<path d="M627 450 C618 397 630 348 653 315 C654 286 667 255 691 249 C714 256 728 286 726 315 C750 350 762 398 753 449 L730 464 L709 451 L690 470 L671 451 L649 464 Z" fill="url(#robe)"/>
