<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#10151b"/>
  <rect x="30" y="30" width="1140" height="740" rx="18" fill="#171e27" stroke="#394656" stroke-width="3"/>
  <text x="60" y="78" fill="#f2f5f7" font-family="sans-serif" font-size="30" font-weight="700">WAYSTONE 重画提案</text>
  <text x="60" y="110" fill="#95a6b8" font-family="sans-serif" font-size="16">Hub 导航地标 · 3×4 tile · 北/南成对使用</text>

  <g transform="translate(70 145)">
    <text x="0" y="0" fill="#72e0e8" font-family="sans-serif" font-size="18" font-weight="700">A. 主体轮廓</text>
