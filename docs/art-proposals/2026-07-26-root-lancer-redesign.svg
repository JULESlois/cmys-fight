<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1210"/><stop offset="1" stop-color="#172116"/></linearGradient><linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9d7b46"/><stop offset="1" stop-color="#3b2b1e"/></linearGradient><linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cde66f"/><stop offset="1" stop-color="#557b35"/></linearGradient><style>.t{font:700 34px system-ui;fill:#eef8e8}.h{font:700 22px system-ui;fill:#cde66f}.b{font:500 17px system-ui;fill:#d5dfd0}.s{font:500 14px system-ui;fill:#aab9a5}.p{fill:#111a17;stroke:#34453a;stroke-width:2}</style></defs>
<rect width="1200" height="800" fill="url(#bg)"/><text x="40" y="55" class="t">CMYS-FIGHT 美术重画提案：Root Lancer 根枪兵</text><text x="40" y="88" class="s">类别：怪物 / 森林远程狙击单位 · 32×32 基准</text>
<rect x="32" y="115" width="360" height="610" rx="14" class="p"/><text x="55" y="152" class="h">现状与目标</text><text x="55" y="190" class="b">当前问题</text><text x="70" y="220" class="s">• 与普通树人轮廓接近，狙击职责不突出</text><text x="70" y="246" class="s">• 长枪与身体层级不清，远距离难判断朝向</text><text x="70" y="272" class="s">• 0.88 秒前摇缺少持续增强的瞄准反馈</text><text x="70" y="298" class="s">• 根系、木质与毒针弹缺少统一材质语言</text><text x="55" y="342" class="b">视觉目标</text><text x="70" y="372" class="s">• 建立“细高、前倾、长枪突出”的狙击轮廓</text><text x="70" y="398" class="s">• 用发光树液线连接眼部、枪身与弹道</text><text x="70" y="424" class="s">• 攻击前摇逐级锁定，玩家可明确读秒</text><text x="70" y="450" class="s">• 保持森林主题但避开背景绿色同化</text><text x="55" y="494" class="b">建议色板</text><g><rect x="70" y="518" width="54" height="30" fill="#2c241d"/><rect x="132" y="518" width="54" height="30" fill="#6a4c2d"/><rect x="194" y="518" width="54" height="30" fill="#6f9f4b"/><rect x="256" y="518" width="54" height="30" fill="#cde66f"/><rect x="318" y="518" width="54" height="30" fill="#f4ffd0"/></g><text x="70" y="570" class="s">深木 / 树皮 / 苔绿 / 树液光 / 命中高光</text>
<rect x="415" y="115" width="430" height="610" rx="14" class="p"/><text x="438" y="152" class="h">概念主视图</text><ellipse cx="625" cy="620" rx="120" ry="25" fill="#000" opacity=".55"/>
<g transform="translate(455 165)"><path d="M130 360 L112 230 L145 120 L178 225 L168 360 Z" fill="url(#wood)" stroke="#1d1814" stroke-width="8"/><path d="M103 238 L70 280 L95 298 L130 260 Z" fill="#526b37" stroke="#1d1814" stroke-width="7"/><path d="M175 235 L210 275 L190 297 L158 260 Z" fill="#526b37" stroke="#1d1814" stroke-width="7"/><path d="M117 128 L145 75 L177 130 L164 173 L130 173 Z" fill="#526b37" stroke="#1d1814" stroke-width="8"/><path d="M130 104 L145 82 L160 105 L151 126 L138 126 Z" fill="#f4ffd0"/><path d="M165 240 L330 155" stroke="#4a3322" stroke-width="18" stroke-linecap="round"/><path d="M322 160 L385 122 L344 185 Z" fill="url(#leaf)" stroke="#27351f" stroke-width="7"/><path d="M185 229 L314 164" stroke="#cde66f" stroke-width="5"/><path d="M117 357 L87 416 M170 357 L199 416" stroke="#4b3928" stroke-width="22" stroke-linecap="round"/><path d="M88 415 L55 432 M199 415 L231 432" stroke="#4b3928" stroke-width="17" stroke-linecap="round"/><g fill="#cde66f"><circle cx="145" cy="147" r="8"/><circle cx="235" cy="203" r="5"/><circle cx="279" cy="181" r="4"/></g><g fill="#779c43"><path d="M95 210 q-38-28-42-64 q35 8 60 39z"/><path d="M181 205 q34-30 46-59 q-39 4-61 37z"/></g></g>
<text x="455" y="670" class="s">轮廓：细高树躯、前倾肩线、枪尖超过身体宽度 1.5 倍</text><text x="455" y="696" class="s">材质：暗木主体、苔叶肩甲、亮树液瞄准线、叶片枪头</text>
<rect x="868" y="115" width="300" height="610" rx="14" class="p"/><text x="892" y="152" class="h">动画与玩法</text><text x="892" y="190" class="b">关键动画</text><text x="907" y="220" class="s">待机：枪尖轻摆，树液沿枪身缓慢流动</text><text x="907" y="246" class="s">移动：根足交替拔出，身体保持低频前倾</text><text x="907" y="272" class="s">前摇：三段锁定，眼光→枪身→枪尖依次变亮</text><text x="907" y="298" class="s">射击：枪杆后坐 3px，叶片枪头短暂闭合</text><text x="907" y="324" class="s">受击：树皮裂光，枪尖偏离目标线</text><text x="907" y="350" class="s">死亡：根足失稳，枪先落地，身体碎成木片</text><text x="892" y="398" class="b">可读性要求</text><text x="907" y="428" class="s">• 0.88 秒前摇至少分成 3 个视觉阶段</text><text x="907" y="454" class="s">• 瞄准线不得与地面毒区使用同一亮度</text><text x="907" y="480" class="s">• 枪尖始终指向实际弹道方向</text><text x="907" y="506" class="s">• 受击反馈不能完全覆盖前摇状态</text><text x="892" y="554" class="b">实现建议</text><text x="907" y="584" class="s">拆分身体、枪杆、枪头、树液线四层</text><text x="907" y="610" class="s">前摇事件绑定 30% / 65% / 90% 时间点</text><text x="907" y="636" class="s">针弹使用浅黄核心与深绿尾迹</text><text x="892" y="680" class="b">下一步评审</text><text x="907" y="708" class="s">枪长、前倾角、锁定线亮度、死亡节奏</text>
<text x="40" y="765" class="s">记录：本次对象 Root Lancer。近期已处理：幽影史莱姆、Lantern Wraith、Guard Form、Old Pistol、Rusty Shotgun。</text></svg>