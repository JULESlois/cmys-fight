<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a0d14"/><stop offset="1" stop-color="#171126"/></linearGradient><radialGradient id="core"><stop stop-color="#f5e9ff"/><stop offset=".25" stop-color="#d16cff"/><stop offset=".7" stop-color="#6d2db2"/><stop offset="1" stop-color="#241338"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font:700 32px sans-serif;fill:#f4f0ff}.h{font:700 21px sans-serif;fill:#d99cff}.b{font:500 16px sans-serif;fill:#d7d4df}.s{font:500 14px sans-serif;fill:#a9a4b4}.p{fill:#111723;stroke:#343c50;stroke-width:2}</style></defs>
<rect width="1200" height="800" fill="url(#bg)"/><text x="38" y="54" class="t">CMYS-FIGHT 美术重画提案：试炼祭坛 Trial Altar</text><text x="38" y="82" class="s">对象：场景 / 交互点　定位：高难试炼入口与风险确认装置</text>
<rect x="30" y="105" width="360" height="275" rx="12" class="p"/><text x="50" y="140" class="h">现状问题</text><text x="52" y="175" class="b">• 祭坛与普通符文装饰轮廓接近，远距离识别弱</text><text x="52" y="205" class="b">• “高风险试炼”缺少压迫感与明确状态反馈</text><text x="52" y="235" class="b">• 激活、选择难度、确认进入之间缺少阶段变化</text><text x="52" y="265" class="b">• 紫色发光容易与档案区环境光混淆</text><text x="52" y="315" class="h">视觉目标</text><text x="52" y="345" class="b">建立尖锐、封印、审判感的独立剪影；</text><text x="52" y="369" class="b">让玩家一眼识别“高难挑战，而非普通传送点”。</text>
<rect x="410" y="105" width="760" height="480" rx="12" class="p"/><text x="432" y="140" class="h">具体概念方案</text>
<g transform="translate(760 340)"><ellipse cx="0" cy="155" rx="210" ry="38" fill="#05070c" opacity=".75"/><path d="M-150 120 L-120 45 L-85 20 L-70 -70 L-20 -105 L0 -180 L20 -105 L70 -70 L85 20 L120 45 L150 120 Z" fill="#252a36" stroke="#6b7080" stroke-width="8"/><path d="M-112 108 L-88 55 L-55 34 L-45 -40 L-10 -65 L0 -122 L10 -65 L45 -40 L55 34 L88 55 L112 108 Z" fill="#151923" stroke="#9f68c9" stroke-width="5"/><circle cx="0" cy="15" r="68" fill="url(#core)" filter="url(#g)"/><path d="M-32 -8 L0 -52 L32 -8 L16 42 L-16 42 Z" fill="none" stroke="#f2d2ff" stroke-width="6"/><path d="M-170 118 Q0 170 170 118" fill="none" stroke="#7f43be" stroke-width="9"/><g fill="#d16cff" filter="url(#g)"><circle cx="-130" cy="45" r="8"/><circle cx="130" cy="45" r="8"/><circle cx="0" cy="-135" r="8"/></g><path d="M-75 125 L-40 80 M75 125 L40 80" stroke="#e8b8ff" stroke-width="5"/><g fill="#6d2db2"><rect x="-190" y="120" width="55" height="22"/><rect x="135" y="120" width="55" height="22"/><rect x="-80" y="145" width="160" height="18"/></g></g>
<text x="445" y="545" class="s">轮廓：三尖封印门 + 悬浮审判核心 + 断裂环形基座</text>
<rect x="30" y="400" width="360" height="185" rx="12" class="p"/><text x="50" y="435" class="h">轮廓与配色</text><text x="52" y="470" class="b">主材质：冷黑石、旧银边、紫晶封印</text><text x="52" y="500" class="b">危险提示：低饱和猩红，仅用于困难确认阶段</text><text x="52" y="530" class="b">高光：淡紫白，不与青色传送门体系混用</text><g transform="translate(52 548)"><rect width="48" height="22" fill="#151923"/><rect x="58" width="48" height="22" fill="#353b4a"/><rect x="116" width="48" height="22" fill="#6d2db2"/><rect x="174" width="48" height="22" fill="#d16cff"/><rect x="232" width="48" height="22" fill="#f2d2ff"/></g>
<rect x="30" y="605" width="1140" height="150" rx="12" class="p"/><text x="50" y="640" class="h">动画、特效与玩法可读性</text><text x="52" y="675" class="b">待机：核心缓慢收缩，三枚节点按顺序呼吸；接近：外环符文逐段点亮；选择难度：核心颜色与尖刺高度变化。</text><text x="52" y="705" class="b">确认：0.45秒封印锁定，三节点同时闭合后开启；受限状态：核心熄灭、断环下沉。交互范围必须与危险地面提示分层。</text><text x="52" y="735" class="s">下一步评审：尖刺高度、困难模式猩红占比、确认前摇长度、核心脉冲频率、与远征门的轮廓区分。</text>
</svg>