<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#12181c"/><text x="40" y="48" fill="#eef4df" font-family="monospace" font-size="28">MOSS BRUTE REDESIGN</text><text x="40" y="76" fill="#9fb08b" font-family="monospace" font-size="14">Forest melee enemy · silhouette and attack-readability proposal</text><g transform="translate(55 120)"><rect width="360" height="440" rx="12" fill="#1b2429" stroke="#405057" stroke-width="2"/><ellipse cx="180" cy="390" rx="110" ry="20" fill="#090d0f"/><path d="M115 310h45l-8 82H98zM205 310h45l17 82h-55z" fill="#35472e" stroke="#0b0f10" stroke-width="8"/><path d="M92 145l42-50 93 3 49 50 10 145-38 62H111l-39-65z" fill="#4f6e42" stroke="#0b0f10" stroke-width="10"/><path d="M58 165l34-66 50-20 18-34 28 33 45-39 11 47 61 53-20 49-51-17-53 16-56-18z" fill="#31572f" stroke="#0b0f10" stroke-width="10"/><path d="M132 150l28-28h56l28 31-12 61h-91z" fill="#6f8951" stroke="#0b0f10" stroke-width="8"/><rect x="151" y="158" width="18" height="12" fill="#f0c45c"/><rect x="205" y="158" width="18" height="12" fill="#f0c45c"/><path d="M69 202l-45 44 15 91 55-23 24-74zM275 202l48 42-11 93-57-22-20-75z" fill="#435f38" stroke="#0b0f10" stroke-width="9"/><path d="M119 247l34-22 17 124h-43zM208 228l37 20-12 101h-42z" fill="#8b6543"/><circle cx="114" cy="93" r="18" fill="#7cae4d"/><circle cx="249" cy="103" r="20" fill="#a0c95a"/><text x="22" y="420" fill="#b9c7ae" font-family="monospace" font-size="13">Wide moss canopy · recessed head · heavy root feet</text></g><g transform="translate(450 120)"><rect width="500" height="210" rx="12" fill="#1b2429" stroke="#405057" stroke-width="2"/><text x="22" y="34" fill="#eef4df" font-family="monospace" font-size="18">0.34 s ATTACK WINDUP</text><g font-family="monospace" font-size="12" fill="#cbd8c0"><text x="25" y="78">1  Brace: feet widen and torso settles</text><text x="25" y="110">2  Load: shoulders drop, fists pull inward</text><text x="25" y="142">3  Tell: two short yellow ground lanes appear</text><text x="25" y="174">4  Impact: double slam, narrow cracks, no opaque dust</text></g></g><g transform="translate(450 355)"><rect width="500" height="205" rx="12" fill="#1b2429" stroke="#405057" stroke-width="2"/><text x="22" y="34" fill="#eef4df" font-family="monospace" font-size="18">PALETTE / IMPLEMENTATION</text><g font-family="monospace" font-size="13" fill="#cbd8c0"><rect x="25" y="58" width="36" height="24" fill="#0b0f10"/><text x="72" y="75">ink</text><rect x="125" y="58" width="36" height="24" fill="#31572f"/><text x="172" y="75">moss</text><rect x="225" y="58" width="36" height="24" fill="#6f8951"/><text x="272" y="75">body</text><rect x="325" y="58" width="36" height="24" fill="#8b6543"/><text x="372" y="75">bark</text><rect x="425" y="58" width="36" height="24" fill="#f0c45c"/><text x="468" y="75">tell</text><text x="25" y="118">• Preserve current hitbox, speed and damage</text><text x="25" y="146">• Animate arms independently from shared body pose</text><text x="25" y="174">• Maintain 1 px negative space around the head</text></g></g><text x="40" y="610" fill="#78867d" font-family="monospace" font-size="13">Review: canopy width · head separation · fist-lane timing · forest contrast</text></svg>