<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" fill="#111923"/>
<text x="48" y="58" fill="#e8fbff" font-family="monospace" font-size="30" font-weight="700">SNOW TURRET / 雪地炮塔</text>
<text x="48" y="88" fill="#8fb6c8" font-family="monospace" font-size="16">crawler silhouette · twin cryo fork · readable four-shot scatter</text>
