<g font-family="monospace">
<text x="548" y="154" fill="#e8fbff" font-size="22" font-weight="700">具体概念方案</text>
<text x="548" y="190" fill="#b8d5df" font-size="16">• 低矮履带底盘，避免误读成人形枪手</text>
<text x="548" y="220" fill="#b8d5df" font-size="16">• 炮塔上盖形成冰脊，机身保持后重前窄</text>
<text x="548" y="250" fill="#b8d5df" font-size="16">• 双层冷冻发射叉分别承担上下散射轴</text>
<text x="548" y="280" fill="#b8d5df" font-size="16">• 四发预警用两组分叉亮点，不画连续扇面</text>
<text x="548" y="310" fill="#b8d5df" font-size="16">• 受击时履带不位移，炮塔短促偏转 1–2 px</text>
<text x="548" y="364" fill="#e8fbff" font-size="22" font-weight="700">状态节奏</text>
<text x="548" y="400" fill="#b8d5df" font-size="16">IDLE  冷凝窗慢脉冲；上盖轻浮 1 px</text>
<text x="548" y="430" fill="#b8d5df" font-size="16">WINDUP 0.42s  炮叉收束 → 四点锁定</text>
<text x="548" y="460" fill="#b8d5df" font-size="16">FIRE  双叉后坐 4–5 px，喷出短霜晶</text>
<text x="548" y="490" fill="#b8d5df" font-size="16">RECOVER  排汽一次，炮叉分离复位</text>
</g>
<g transform="translate(55 520)" font-family="monospace">
<rect width="850" height="78" rx="8" fill="#17232e" stroke="#365365"/>
<text x="20" y="28" fill="#dfffff" font-size="16" font-weight="700">配色：</text>
<rect x="88" y="13" width="24" height="24" fill="#354e5d"/><text x="120" y="31" fill="#b8d5df" font-size="14">履带深钢</text>
<rect x="224" y="13" width="24" height="24" fill="#79b7c8"/><text x="256" y="31" fill="#b8d5df" font-size="14">冷冻机壳</text>
<rect x="376" y="13" width="24" height="24" fill="#d7f6fa"/><text x="408" y="31" fill="#b8d5df" font-size="14">冰霜高光</text>
<rect x="536" y="13" width="24" height="24" fill="#7de3f5"/><text x="568" y="31" fill="#b8d5df" font-size="14">锁定青光</text>
<text x="20" y="58" fill="#8fb6c8" font-size="14">目标：1× 缩放下先读出履带、炮塔和双叉，再读出冰霜材质与四发散射。</text>
</g>
</svg>